<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Test Playground 1</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
<nav>
    <a href="test_webpage.html" class="logo" id="nav-logo">TestPlayground</a>
    <ul>
      <li><a href="about.html" id="nav-about">About</a></li>
    </ul>
  </nav>

  <main>
    <div class="card">
      <h1>Contact us</h1>
      <p class="sub">Fill in the form and we'll get back to you.</p>

      <form id="contact-form" >
        <div class="field">
          <label for="name">Full name</label>
          <input type="text" id="name" name="name" placeholder="Jane Doe" required>
          <div class="error" id="name-error"></div>
        </div>
        <div class="field">
          <label for="email">Email</label>
          <input type="email" id="email" name="email" placeholder="jane@example.com" required>
          <div class="error" id="email-error"></div>
        </div>
        <div class="field">
          <label for="topic">Topic</label>
          <select id="topic" name="topic" required>
            <option value="">Choose one</option>
            <option value="support">Support</option>
            <option value="sales">Sales</option>
            <option value="other">Other</option>
          </select>
          <div class="error" id="topic-error"></div>
        </div>

        <div class="field">
          <label for="message">Message</label>
          <textarea id="message" name="message" placeholder="Write your message..." required></textarea>
          <div class="error" id="message-error"></div>
        </div>

        <div class="check">
          <input type="checkbox" id="terms" name="terms" required>
          <label for="terms">I agree to the terms</label>
        </div>
        <div class="error" id="terms-error"></div>

        <button type="submit" id="submit-btn">Send message</button>
        <div id="success">Message sent. Thank you!</div>
      </form>
    </div>
  </main>
  <script src="test.js"></script>
</body>
</html>
